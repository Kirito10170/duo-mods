name: Build companions

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  totk:
    runs-on: ubuntu-24.04
    env:
      VERSION: 0.1.0
      BUILD_ID: 5CB42B1CF25469FB0635FD046453D843C18BC8AB000000000000000000000000
    steps:
      - uses: actions/checkout@v4

      # Header-only module SDK and the BCn decoder from Eden Duo 1.3.2.2.
      - uses: actions/checkout@v4
        with:
          repository: igawa6/eden-duo
          ref: 5fa93ed4de1a3f0838f01ef999eaa4a6582055ef
          path: eden-duo
          sparse-checkout: |
            src/core/mods
            externals/bc_decoder

      # zstd v1.5.7 (decompression sources only are compiled) for TOTK's romfs.
      - uses: actions/checkout@v4
        with:
          repository: facebook/zstd
          ref: v1.5.7
          path: zstd
          sparse-checkout: lib

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build Android module (arm64-v8a)
        run: |
          cmake -S native -B build/android -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static \
            -DEDEN_SOURCE_ROOT="$GITHUB_WORKSPACE/eden-duo" -DZSTD_SOURCE_ROOT="$GITHUB_WORKSPACE/zstd"
          cmake --build build/android
          ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            build/android/0100F2C0115B6000.so

      - name: Build desktop module (linux-x86_64)
        run: |
          cmake -S native -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DEDEN_SOURCE_ROOT="$GITHUB_WORKSPACE/eden-duo" -DZSTD_SOURCE_ROOT="$GITHUB_WORKSPACE/zstd"
          cmake --build build/linux
          build/linux/totk-gamedata-test
          build/linux/totk-travel-test
          strip build/linux/0100F2C0115B6000.so

      - name: Package
        run: |
          python3 tools/build_dualscreen_package.py --package packages/TearsOfTheKingdom \
            --output dist --version "$VERSION" --name "Tears of the Kingdom companion" \
            --min-runtime 22 --build-id "$BUILD_ID" \
            --module android-arm64-v8a=build/android/0100F2C0115B6000.so \
            --module linux-x86_64=build/linux/0100F2C0115B6000.so
          python3 tools/compact_zip.py dist/0100F2C0115B6000.dsmod.zip
          mv dist/0100F2C0115B6000.dsmod.zip "dist/0100F2C0115B6000-TearsOfTheKingdom-$VERSION.dsmod.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: totk-companion
          path: dist/*.dsmod.zip
